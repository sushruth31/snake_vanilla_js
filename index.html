<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Snake</h1>
      <p class="scoreline">Score: <span class="score">0</span></p>
      <div class="controls">
        <button type="button" id="start">Start</button>
        <button type="button" id="pause">Pause</button>
      </div>
      <div id="board" aria-label="Game board" role="img"></div>
      <p class="hint">Arrow keys or WASD to steer.</p>
    </main>
    <div id="overlay" role="alertdialog" aria-labelledby="outcome">
      <div class="panel">
        <h2 id="outcome">Game over</h2>
        <p>Your score: <span class="score">0</span></p>
        <button type="button" id="restart">Play again</button>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
