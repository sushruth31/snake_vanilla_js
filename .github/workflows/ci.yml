name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # No install step: the project has no dependencies, and the test runner is
  # node:test from the standard library.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Parse every module
        run: npm run check
      - name: Run the test suite
        run: npm test
